name = "mac-hatirlatici-push"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Yedek tetik: her dakika (asil tetik asagidaki Saat alarmi)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mac-hatirlatici-push"
database_id = "416f2737-cd46-461a-ba58-f473b3756ffa"

# Dakikalik tetik icin ASIL mekanizma: kendini yeniden kuran Durable Object alarmi.
# (Yeni hesapta cron tetikleyicisi 30+ dk hic calismadi; cron yedek olarak kaliyor.)
[[durable_objects.bindings]]
name = "SAAT"
class_name = "Saat"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Saat"]

[vars]
FIKSTUR_URL   = "https://raw.githubusercontent.com/seslitespih/mac-hatirlatici/main/assets/matches-daily.json"
EXPO_PUSH_URL = "https://exp.host/--/api/v2/push/send"

# Istege bagli gizli anahtar (Expo "enhanced push security" acilirsa):
#   npx wrangler secret put EXPO_ACCESS_TOKEN
