name: Android Play Store Build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must be > 5)'
        required: true
        default: '52'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # Varsayilan "tools platform-tools" — 'tools' paketi Android deposundan kaldirildi,
          # sdkmanager 16.0 ile adim dusuyordu (18 Eyl 2026). Yalniz platform-tools yeterli.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install NDK 28 (16KB page-size support)
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          printf 'GROQ_API_KEY=%s\nREVENUECAT_IOS_KEY=%s\nREVENUECAT_ANDROID_KEY=%s\n' \
            "${{ secrets.GROQ_API_KEY }}" \
            "${{ secrets.REVENUECAT_IOS_KEY }}" \
            "${{ secrets.REVENUECAT_ANDROID_KEY }}" > .env

      - name: google-services.json (FCM — push bildirimleri)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
            echo "google-services.json yazildi ($(wc -c < google-services.json) bayt)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret yok — AAB push'suz (yalniz yerel bildirim) derlenecek"
          fi

      - name: Expo prebuild (Android)
        env:
          BUILD_NUMBER: ${{ github.event.inputs.version_code }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: npx expo prebuild --platform android --clean

      - name: API 36 icin AGP uyarisini bastir
        # Play 21 Eyl 2026'dan beri hedef API 36 istiyor. Expo 52'nin AGP'si (8.6.0)
        # API 36'yi "bilinmeyen" sayip derlemeyi durduruyor; bu bayrak platform kurulu
        # oldugunda derlemeye izin verir. Expo SDK yukseltilince bu adim kaldirilabilir.
        run: |
          echo "" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          tail -3 android/gradle.properties

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mac-hatirlatici.keystore

      - name: Build Release AAB
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          cd android
          # expo prebuild --clean, release'i debug anahtariyla imzalayan build.gradle uretiyor;
          # -Pandroid.storeFile gibi ozellikleri okuyan yok (69 numarali paket Play'den bu yuzden
          # "yanlis anahtar" ile dondu). AGP'nin injected.signing ozellikleri her varyanti imzalar.
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/mac-hatirlatici.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Imza kontrolu (Play yukleme anahtari)
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/*.aab | tee /tmp/imza.txt
          grep -q "C4:08:04:44:20:02:A3:60:E1:7A:4C:92:9C:06:B2:C1:73:C9:40:18" /tmp/imza.txt \
            || { echo "::error::AAB yukleme anahtariyla imzalanmamis"; exit 1; }

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: HangiKanalda-${{ github.event.inputs.version_code }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # Play Store upload disabled — AAB artifact'tan manuel yükle
      # - name: Upload to Google Play (Internal Track)
      #   uses: r0adkll/upload-google-play@v1
